[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "mediapipe-project"
version = "0.1.0"
description = "MediaPipe ML Project"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "seaborn",
    "scikit-learn",
    "pyyaml",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "flake8",
    "black",
]
deploy = [
    "fastapi",
    "uvicorn",
]

[tool.black]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
